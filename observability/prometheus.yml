# Скрапится только внутренняя docker-сеть: наружу /metrics не выставлен,
# Caddy на него отвечает 404.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: ragu-back
    metrics_path: /metrics
    static_configs:
      - targets: ["back:8000"]
        labels:
          service: back

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
