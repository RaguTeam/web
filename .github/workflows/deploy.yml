name: $raggu_web_front_app

permissions: write-all

on:
    workflow_dispatch:
    push:
    pull_request:
    delete:

concurrency:
    group: deploy-${{ github.ref }}
    cancel-in-progress: true


jobs:
    build:
        if: github.event_name != 'delete'
        runs-on: ubuntu-latest

        steps:
            - uses: hyoo-ru/mam_build@master2
              with:
                  package: "raggu/web"
                  modules: 'front/app'

            - uses: pnpm/action-setup@v4
              with:
                  version: 11.20.0

            - uses: actions/setup-node@v4
              with:
                  node-version: 26
                  cache: pnpm
                  cache-dependency-path: raggu/web/front/ragu-site/pnpm-lock.yaml

            - name: Build site
              working-directory: raggu/web/front/ragu-site
              env:
                  RAGU_BASE: /web/site/
              run: |
                  pnpm install --frozen-lockfile
                  pnpm --filter @ugar/ragu-site build

            - name: Deploy main
              if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
              uses: hyoo-ru/gh-deploy@v4.4.1
              with:
                  folder: "raggu/web/front/app/-"
                  clean-exclude: |
                      site

            - name: Deploy site
              if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
              uses: hyoo-ru/gh-deploy@v4.4.1
              with:
                  folder: "raggu/web/front/ragu-site/apps/ragu-site/dist"
                  target-folder: site

            - name: Deploy feature branch
              if: startsWith(github.ref, 'refs/heads/feature/')
              uses: hyoo-ru/gh-deploy@v4.4.1
              with:
                  folder: "raggu/web/front/app/-"
                  target-folder: ${{ github.ref_name }}

    cleanup:
        if: github.event_name == 'delete' && startsWith(github.event.ref, 'feature/')
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4
              with:
                  ref: gh-pages

            - name: Remove feature folder
              run: |
                  BRANCH_NAME="${{ github.event.ref }}"
                  FOLDER="feature/${BRANCH_NAME#feature/}"
                  if [ -d "$FOLDER" ]; then
                    git config user.name "github-actions[bot]"
                    git config user.email "github-actions[bot]@users.noreply.github.com"
                    git rm -rf "$FOLDER"
                    git commit -m "Clean up preview for deleted branch: $BRANCH_NAME"
                    git push
                  fi
