name: $raggu_web_front_app

permissions: write-all

on:
    workflow_dispatch:
    push:
    pull_request:
    delete:

concurrency:
    group: deploy-${{ github.ref }}
    cancel-in-progress: true


jobs:
    build:
        if: github.event_name != 'delete'
        runs-on: ubuntu-latest

        steps:
            - uses: b-on-g/mam_build2@master
              with:
                  package: "raggu/web"
                  modules: 'front/app'

            # RAGU_API в Settings → Variables — адрес бэкенда (по умолчанию
            # https://ragu-back.duckdns.org, зашитый в код). Откат — очистить
            # переменную и перезапустить workflow.
            - name: Point old app at RAGU_API
              if: vars.RAGU_API != '' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
              working-directory: raggu/web/front/app/-
              env:
                  RAGU_API: ${{ vars.RAGU_API }}
              # Без sed: значение из веб-формы легко приходит с переводом строки или
              # пробелом, и sed падал на нём с невнятным кодом 123.
              run: |
                  python3 - <<'PY'
                  import os, pathlib, re, sys
                  old = "https://ragu-back.duckdns.org"
                  new = os.environ["RAGU_API"].strip().rstrip("/")
                  if not re.fullmatch(r"https?://[A-Za-z0-9.-]+(:[0-9]+)?", new):
                      sys.exit(f"RAGU_API должна быть вида https://host[:port], а пришло {os.environ['RAGU_API']!r}")
                  changed = []
                  for path in pathlib.Path(".").rglob("*"):
                      if path.is_file() and not path.is_symlink() and path.suffix in (".js", ".mjs"):
                          text = path.read_text(encoding="utf-8")
                          if old in text:
                              path.write_text(text.replace(old, new), encoding="utf-8")
                              changed.append(str(path))
                  web = pathlib.Path("web.js").read_text(encoding="utf-8")
                  if old in web or new not in web:
                      sys.exit("web.js не переключился на RAGU_API")
                  print(f"{old} -> {new} в {len(changed)} файлах: {', '.join(sorted(changed))}")
                  PY

            - name: Deploy main
              if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
              uses: hyoo-ru/gh-deploy@v4.4.1
              with:
                  folder: "raggu/web/front/app/-"
                  clean-exclude: |
                      site

            - name: Deploy feature branch
              if: startsWith(github.ref, 'refs/heads/feature/')
              uses: hyoo-ru/gh-deploy@v4.4.1
              with:
                  folder: "raggu/web/front/app/-"
                  target-folder: ${{ github.ref_name }}

    cleanup:
        if: github.event_name == 'delete' && startsWith(github.event.ref, 'feature/')
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4
              with:
                  ref: gh-pages

            - name: Remove feature folder
              run: |
                  BRANCH_NAME="${{ github.event.ref }}"
                  FOLDER="feature/${BRANCH_NAME#feature/}"
                  if [ -d "$FOLDER" ]; then
                    git config user.name "github-actions[bot]"
                    git config user.email "github-actions[bot]@users.noreply.github.com"
                    git rm -rf "$FOLDER"
                    git commit -m "Clean up preview for deleted branch: $BRANCH_NAME"
                    git push
                  fi
