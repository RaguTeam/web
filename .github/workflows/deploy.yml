name: $raggu_web_front_app

permissions: write-all

on:
    workflow_dispatch:
    push:
    pull_request:
    delete:

concurrency:
    group: deploy-${{ github.ref }}
    cancel-in-progress: true


jobs:
    build:
        if: github.event_name != 'delete'
        runs-on: ubuntu-latest

        steps:
            - name: Checkout MAM
              uses: actions/checkout@v4
              with:
                  repository: hyoo-ru/mam
                  ref: master

            - name: Checkout package
              uses: actions/checkout@v4
              with:
                  path: raggu/web

            - name: Install MAM dependencies
              run: |
                  npm install --omit=optional
                  # MAM calls convertCompilerOptionsFromJson; keep TypeScript on a version that exposes it.
                  npm install --save-exact --omit=optional typescript@6.0.3

            - name: Build front app
              run: npm start raggu/web/front/app

            - name: Deploy main
              if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
              uses: hyoo-ru/gh-deploy@v4.4.1
              with:
                  folder: "raggu/web/front/app/-"

            - name: Deploy feature branch
              if: startsWith(github.ref, 'refs/heads/feature/')
              uses: hyoo-ru/gh-deploy@v4.4.1
              with:
                  folder: "raggu/web/front/app/-"
                  target-folder: ${{ github.ref_name }}

    cleanup:
        if: github.event_name == 'delete' && startsWith(github.event.ref, 'feature/')
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4
              with:
                  ref: gh-pages

            - name: Remove feature folder
              run: |
                  BRANCH_NAME="${{ github.event.ref }}"
                  FOLDER="feature/${BRANCH_NAME#feature/}"
                  if [ -d "$FOLDER" ]; then
                    git config user.name "github-actions[bot]"
                    git config user.email "github-actions[bot]@users.noreply.github.com"
                    git rm -rf "$FOLDER"
                    git commit -m "Clean up preview for deleted branch: $BRANCH_NAME"
                    git push
                  fi
