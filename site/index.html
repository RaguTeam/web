    <script>
        // Resolve the theme before first paint so the page never flashes the wrong surface.
        // Values are JSON — the same encoding the app's store writes.
        (function () {
            function read(key, fallback) {
                try {
                    var raw = localStorage.getItem(key);
                    return raw === null ? fallback : JSON.parse(raw);
                } catch (e) {
                    return fallback;
                }
            }

            try {
                var stored = read('ragu.theme', 'system');
                var dark = stored === 'dark' || (stored !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
                document.documentElement.dataset.theme = dark ? 'dark' : 'light';
                document.documentElement.lang = read('ragu.lang', 'en') === 'ru' ? 'ru' : 'en';
            } catch (e) { /* private mode — fall back to the markup default */ }
        })();
    </script>
