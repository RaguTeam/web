services:
  embedder:
    build:
      context: ./embedder
      dockerfile: Dockerfile
    image: ragu-embedder:local
    restart: unless-stopped
    environment:
      # Модели, которые поднимаются сразу; поле `model` в запросе выбирает нужную.
      EMBEDDER_MODELS: "BAAI/bge-large-en-v1.5,Alibaba-NLP/gte-multilingual-base"
    expose:
      - "8001"                            # только внутрь сети docker

  back:
    build:
      context: ./back
      dockerfile: Dockerfile
    image: ragu-web-api:local
    restart: unless-stopped
    depends_on: [embedder]
    env_file: .env
    environment:
      # Эти значения переопределяют .env (compose environment > env_file), чтобы
      # старые строки в .env (напр. Yandex-эмбеддер) не ломали векторный поиск.
      RAGU_INDEXES_DIR: /data/indexes              # путь к индексам внутри контейнера
      EMBEDDER_BASE_URL: http://embedder:8001/v1   # OpenAI-совместимый эндпоинт эмбеддера
      EMBEDDER_MODEL_NAME: Alibaba-NLP/gte-multilingual-base   # дефолт для всех индексов
      EMBEDDER_MODEL_MAP: '{"medical":"BAAI/bge-large-en-v1.5"}'  # переопределение по имени папки индекса
      EMBEDDER_API_KEY: unused
    volumes:
      - ./indexes:/data/indexes:ro
    expose:
      - "8000"                            # только внутрь сети docker

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [back]
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ragu-back.duckdns.org
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
