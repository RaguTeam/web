services:
  embedder:
    build:
      context: ./embedder
      dockerfile: Dockerfile
    image: ragu-embedder:local
    restart: unless-stopped
    environment:
      # Модели, которые поднимаются сразу; поле `model` в запросе выбирает нужную.
      EMBEDDER_MODELS: "BAAI/bge-large-en-v1.5,Alibaba-NLP/gte-multilingual-base"
    expose:
      - "8001"                            # только внутрь сети docker

  ragu-api:
    # Сервис RAGU поверх готового графа: чтение, режимы поиска, генерация,
    # бюджеты, учёт токенов. Бэкенд демо ходит сюда клиентом и сам про граф
    # ничего не знает.
    build:
      context: ./back
      dockerfile: Dockerfile.ragu-api
    image: ragu-api:local
    restart: unless-stopped
    depends_on: [embedder]
    env_file: .env
    environment:
      # host по умолчанию 127.0.0.1 — внутри контейнера это делает сервис
      # недостижимым для соседей по сети.
      RAGU_API_HOST: 0.0.0.0
      RAGU_API_PORT: "8020"
      # Каждый корпус — своя папка. Первый в списке становится графом по
      # умолчанию для плоских путей /v1/search/*.
      RAGU_API_GRAPHS: >-
        [{"id":"medical","storage_folder":"/data/indexes/medical","language":"russian","embedder_dim":768},
         {"id":"ragu-bio","storage_folder":"/data/indexes/ragu_bio","language":"russian","embedder_dim":768},
         {"id":"dennis-ritchie","storage_folder":"/data/indexes/dennis_ritchie","language":"english","embedder_dim":1536}]
      # Пусто — сервис отвечает всем, кто до него дотянется, а каждый запрос
      # стоит вызовов LLM. Наружу он не выставлен, но ключ всё равно задаём.
      RAGU_API_API_KEYS: ${RAGU_API_KEY:?задайте RAGU_API_KEY в .env}
      # Клиентский таймаут в back меньше этого: иначе отвалится сервер и придёт
      # 504 вместо ответа.
      RAGU_API_REQUEST_TIMEOUT: "300"
      RAGU_API_RERANK_TIMEOUT: "10"
      # Эмбеддер и LLM берутся из общего окружения RAGU (ragu.common.env.Env),
      # не из ServiceSettings.
      EMBEDDER_BASE_URL: http://embedder:8001/v1
      EMBEDDER_MODEL_NAME: Alibaba-NLP/gte-multilingual-base
      EMBEDDER_MODEL_MAP: '{}'
      EMBEDDER_API_KEY: unused
      # Обязательны: в Env у них нет значений по умолчанию, и без них сервис не
      # поднимется. Проверяем здесь, чтобы отказ был внятным на старте compose,
      # а не ошибкой валидации в логе контейнера.
      #
      # Для YandexGPT: LLM_MODEL_NAME=gpt://<folder-id>/<модель>,
      # LLM_BASE_URL=https://ai.api.cloud.yandex.net/v1, LLM_API_KEY=<ключ>.
      # Прежние YANDEX_* читал старый бэкенд; RAGU их игнорирует.
      LLM_MODEL_NAME: ${LLM_MODEL_NAME:?задайте LLM_MODEL_NAME в .env}
      LLM_BASE_URL: ${LLM_BASE_URL:?задайте LLM_BASE_URL в .env}
      LLM_API_KEY: ${LLM_API_KEY:?задайте LLM_API_KEY в .env}
      # Реранкер в контейнере эмбеддера, на CPU. Слеш на конце обязателен:
      # клиент RAGU дописывает `score` без разделителя.
      # Отсутствие этих переменных — рабочий режим: сервис ответит без
      # переупорядочивания и скажет об этом в engines.rerank_error.
      RERANKER_BASE_URL: http://embedder:8001/v1/
      RERANKER_MODEL_NAME: BAAI/bge-reranker-base
      RERANKER_API_KEY: unused
    volumes:
      - ./indexes:/data/indexes:ro
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    expose:
      - "8020"                            # только внутрь сети docker

  back:
    build:
      context: ./back
      dockerfile: Dockerfile
    image: ragu-web-api:local
    restart: unless-stopped
    depends_on: [embedder, ragu-api]
    env_file: .env
    environment:
      # Адрес сервиса RAGU. Таймаут строго меньше его RAGU_API_REQUEST_TIMEOUT:
      # больше — отвалится сервер и придёт 504; меньше на порядок — бросим
      # запрос, за который уже заплачено вызовами LLM.
      RAGU_API_URL: http://ragu-api:8020
      RAGU_API_KEY: ${RAGU_API_KEY:?задайте RAGU_API_KEY в .env}
      RAGU_API_TIMEOUT: "240"
      # Одна JSON-строка на запись: поля остаются полями, а не подстроками для
      # grep. Локально переменную не задают — там читаемый текстовый формат.
      LOG_FORMAT: json
      LOG_LEVEL: INFO
    # Индексы не монтируются: бэкенд их не открывает. Файлы графа видит только
    # ragu-api.
    logging:
      # json-file по умолчанию растёт без предела. На машине свободно ~9 ГБ,
      # а стендовая сессия — это всплеск трафика.
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    expose:
      - "8000"                            # только внутрь сети docker

  prometheus:
    image: prom/prometheus:v3.1.0
    restart: unless-stopped
    depends_on: [back]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # На диске свободно ~9 ГБ. Двух недель хватает на стенд с запасом, а без
      # лимита TSDB растёт молча, пока место не кончится.
      - --storage.tsdb.retention.time=14d
      - --storage.tsdb.retention.size=2GB
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    expose:
      - "9090"                            # наружу не выставляем

  grafana:
    image: grafana/grafana:11.5.1
    restart: unless-stopped
    depends_on: [prometheus]
    environment:
      # Пароль обязательно поменять до выкатки — панель публична под /grafana/.
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?задайте GRAFANA_PASSWORD в .env}
      # Grafana живёт в подпути за Caddy, без этих двух переменных она уводит
      # ссылки и статику на корень домена.
      GF_SERVER_ROOT_URL: https://ragu-back.duckdns.org/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      # Не внутрь /var/lib/grafana: там именованный том, и вложенное
      # монтирование поверх него работает только за счёт порядка путей.
      - ./observability/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    expose:
      - "3000"

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [back, grafana]
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ragu-back.duckdns.org
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
  prometheus_data:
  grafana_data:
